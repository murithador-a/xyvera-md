name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (all modules)
        run: npm run lint

      - name: Docs are in sync with the registry
        run: npm run verify:docs

      - name: Offline test suite
        run: npm test

      - name: Initialize without connecting (registry smoke boot)
        run: node src/index.js --check

      - name: Preflight diagnostics (warnings are expected on a fresh clone)
        run: node src/index.js --doctor
